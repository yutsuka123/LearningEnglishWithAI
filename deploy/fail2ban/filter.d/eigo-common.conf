# eigo(study.nyangailab.com)用fail2banフィルターの共通定義(2026-09-26)。
# 対象ログ=Caddyのアクセスログ(JSON・1行1リクエスト・`request.remote_ip`が実クライアントIP)。
# 他プロジェクト(相乗り)のログ・設定には一切触れない(このjailはstudy.logだけを見る)。
[Definition]

# 日時はCaddyの"ts"(UNIX秒・小数付き)。
datepattern = "ts":{EPOCH}

# 検索エンジン・広告・SNSのクローラーは、誤ってBANすると検索流入/広告審査/リンクプレビューを
# 損なうので、UAが名乗っている限りカウントしない(UAは詐称されうるが、詐称するスキャナーを
# 見逃す損失より、本物のクローラーを止める損失の方が大きいため)。
_bot_ua = (?:Googlebot|AdsBot|Mediapartners|GoogleOther|Google-|Storebot|bingbot|Applebot|DuckDuckBot|YandexBot|Baiduspider|facebookexternalhit|Twitterbot|LinkedInBot|Slackbot|Discordbot|WhatsApp|Yahoo)
_ignore_bot = "User-Agent":\["[^"]*%(_bot_ua)s
