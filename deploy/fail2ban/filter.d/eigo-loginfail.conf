# ログイン失敗(HTTP 401/403)の連続。アプリ側にはuser×IP=3回で5分ロック等の対策があるが、
# 状態がプロセス内メモリのためデプロイ再起動で消える(2026-09-15の自己点検)。それを補う。
[INCLUDES]
before = eigo-common.conf

[Definition]
failregex = ^\{.*"remote_ip":"<HOST>",.*"method":"POST","host":"[^"]*","uri":"/api/auth/login".*"status":(?:401|403),
ignoreregex = %(_ignore_bot)s
