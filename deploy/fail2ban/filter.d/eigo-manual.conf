# 管理画面の手動ブロック用(eigo-manual-1h/-24h/-7d/-30d/-perm・2026-10-31)。**何にもマッチしない**フィルター:
# このjailは「ログを見て自動でBANする」ものではなく、ホスト側のeigo-f2b-manual-sync(cron)が
# `fail2ban-client set <jail> banip <IP>` で入れたIPを、期間(bantime)の間だけ遮断するための入れ物。
# logpathは中身が常に空のファイル(/var/lib/eigo-f2b/manual.log)なので、巨大なstudy.logを読まない。
# ⚠️ failregexには必ず <HOST> を含めること(2026-11-03修正): fail2ban 1.0.2は <HOST> (failure-id group)の無いfailregexを
#   "No failure-id group" で拒否し、jailごと起動に失敗する。`fail2ban-client -t`(設定テスト)は通ってしまうので、
#   変更したら deploy/fail2ban/tools/docker_loadtest.sh(使い捨てコンテナで実際に起動・BAN・解除まで確認)を必ず実行すること。
[Definition]
failregex = ^eigo-manual-never-matches-<HOST>$
ignoreregex =
