# 管理画面の手動ブロック用(eigo-manual-1h/-24h/-7d/-30d/-perm・2026-10-31)。**何にもマッチしない**フィルター:
# このjailは「ログを見て自動でBANする」ものではなく、ホスト側のeigo-f2b-manual-sync(cron)が
# `fail2ban-client set <jail> banip <IP>` で入れたIPを、期間(bantime)の間だけ遮断するための入れ物。
# logpathは中身が常に空のファイル(/var/lib/eigo-f2b/manual.log)なので、巨大なstudy.logを読まない。
[Definition]
failregex = ^eigo-manual-never-matches-\d+$
ignoreregex =
