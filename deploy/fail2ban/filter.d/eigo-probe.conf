# 脆弱性スキャナー/探索: このアプリに存在しないはずのURL(WordPress・.env・.git・phpMyAdmin等)を
# 叩くIP。正規ユーザーが踏む理由がなく、2026-06〜09の実ログ(12万件)でログイン実績のあるIPは0件。
[INCLUDES]
before = eigo-common.conf

[Definition]
failregex = ^\{.*"remote_ip":"<HOST>",.*"uri":"[^"]*(?:wp-login|wp-admin|wp-content|wp-includes|xmlrpc|/\.env|/\.git/|phpmyadmin|phpinfo|cgi-bin|/vendor/|actuator|/etc/passwd|boaform|HNAP1|manager/html|\.php|\.asp|\.jsp)
ignoreregex = %(_ignore_bot)s
