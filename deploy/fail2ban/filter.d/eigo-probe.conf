# 脆弱性スキャナー/探索: このアプリに存在しないはずのURL(WordPress・.env・.git・phpMyAdmin等)を
# 叩くIP。正規ユーザーが踏む理由がなく、2026-06〜09の実ログ(12万件)でログイン実績のあるIPは0件。
# 信頼IP(ログイン実績)は免除する(2026-10-04〜)が、信頼IP/許可リストのIPの探索は記録専用jail eigo-probe-trustedが残す(BANはしない)。
[INCLUDES]
before = eigo-common.conf

[Definition]
# ・URIのクエリ文字列は見ない(`[^"?]*`)=`/glossary/x?q=index.php`のような正規URLの誤マッチを防ぐ。
# ・status=307(未ログインの非公開パスは/loginへ転送される)/4xxのときだけ数える=将来`/static/vendor/`等の
#   実在の静的ファイル(200)を足しても、全ユーザーが引っかからない。
failregex = ^\{.*"remote_ip":"<HOST>",.*"uri":"[^"?]*(?:wp-login|wp-admin|wp-content|wp-includes|xmlrpc|/\.env|/\.git/|phpmyadmin|phpinfo|cgi-bin|/vendor/|actuator|/etc/passwd|boaform|HNAP1|manager/html|\.php|\.asp|\.jsp)[^"]*".*"status":(?:307|40[0-9]),
ignoreregex = %(_ignore_bot)s
