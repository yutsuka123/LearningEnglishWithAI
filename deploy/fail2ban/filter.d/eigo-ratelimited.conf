# アプリのレート制限(HTTP 429)に何度も当たるIP=上限を無視して叩き続けているクライアント
# (2026-06〜09の実ログでは「TLM-Audit-Scanner」等のスキャナーが10分に100〜336回)。
[INCLUDES]
before = eigo-common.conf

[Definition]
# 全語/全フレーズ一覧(/api/words・/api/phrases)の429は数えない: 学校・職場・携帯回線など多人数が1つのIPを共有する
# 環境では、正規のゲストが同時に開くだけで当たりうるため(敵対的レビュー指摘)。それ以外の429(汎用の上限・
# ログインのロック等)を、上限を無視して叩き続けるクライアントだけを対象にする。
failregex = ^\{.*"remote_ip":"<HOST>",.*"uri":"(?!/api/(?:words|phrases)\b)[^"]*".*"status":429,
ignoreregex = %(_ignore_bot)s
