# 判定の根拠を監査ログ(/var/log/eigo-f2b-audit.log)に残すだけのアクション。
# mode=dryrun: これだけを使う(=実際にはBANしない「BANしたはず」の記録・導入直後の運用)。
# mode=ban   : iptables-multiport(chain=DOCKER-USER)と一緒に使う(=実BAN+その記録)。
[Definition]
actionstart = /usr/local/sbin/eigo-f2b-audit start <name> - - - <mode>
actionstop  = /usr/local/sbin/eigo-f2b-audit stop <name> - - - <mode>
actioncheck =
actionban   = /usr/local/sbin/eigo-f2b-audit ban <name> <ip> <failures> <bantime> <mode>
actionunban = /usr/local/sbin/eigo-f2b-audit unban <name> <ip> <failures> <bantime> <mode>

[Init]
name = default
mode = dryrun
