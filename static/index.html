  <!-- JS到達ビーコン(2026-09-19・計測設計3-B)。インラインの非モジュール
       scriptで、app.js(ES Module)や各APIの応答を待たずに「このページの
       JSが実行された」ことを1回だけ送る。JS無効/実行前に離脱した訪問
       にはこれが届かない＝HTML着地との差が「JS未到達」。sendBeaconは
       ページ離脱時にも送れる(Content-Typeがtext/plainになる環境でも
       サーバー側で受けられる)。失敗しても画面には影響させない。
       leave=ページを最初に離れた/隠れた時点の滞在ms(ページロードあたり1回)。 -->
  <script>
  (function () {
    function send(kind, category, label, value) {
      try {
        var body = JSON.stringify({
          kind: kind, category: category, label: label, value: value });
        var ok = false;
        if (navigator.sendBeacon) {
          ok = navigator.sendBeacon(
            '/api/system/track',
            new Blob([body], { type: 'application/json' }));
        }
        if (!ok && window.fetch) {
          fetch('/api/system/track', {
            method: 'POST', body: body, keepalive: true,
            headers: { 'Content-Type': 'application/json' } });
        }
      } catch (e) { /* 計測の失敗は無視 */ }
    }
    send('boot', 'html', 'index', Math.round(performance.now()));
    var left = false;
    function leave(why) {
      if (left) return;   // ページロードあたり1回(最初に隠れた/離れた時点)
      left = true;
      send('leave', 'html', why, Math.round(performance.now()));
    }
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') leave('hidden');
    });
    window.addEventListener('pagehide', function () { leave('pagehide'); });
  })();
  </script>
