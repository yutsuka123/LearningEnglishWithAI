<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <!-- 非対応ブラウザ向けの案内(2026-09-26)。ES5のみ・他のスクリプトより前に置く。 -->
  <script src="/static/js/compat-guard.js"></script>
  <title data-i18n="help.metaTitle">パスワードを忘れた方｜nyangailab</title>
  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/i18n_dict.js"></script>
  <script src="/static/js/page-chrome.js"></script>
  <style>
    :root {
      --bg: #161c23; --card: #1f2733; --text: #e6edf3; --sub: #d5dde6;
      --border: #3d4a5e; --accent: #4da3ff; --accent-hover: #6db4ff;
      --err: #ff6b6b; --shadow: rgba(0,0,0,.4); --ok: #5fd08a;
    }
    :root[data-theme="light"] {
      --bg: #eef1f6; --card: #f9fafc; --text: #223; --sub: #556;
      --border: #ccd; --accent: #3b6fd4; --accent-hover: #2f5cb8;
      --err: #c0392b; --shadow: rgba(0,0,0,.08); --ok: #1e7a46;
    }
    :root[data-font-size="small"] body { zoom: 0.88; }
    :root[data-font-size="large"] body { zoom: 1.32; }
    :root[data-font-size="xlarge"] body { zoom: 1.63; }
    .pagebar { position: fixed; top: 12px; right: 12px; display: flex; gap: 8px; align-items: center; z-index: 10; }
    .pagebar select { width: auto; margin: 0; padding: 5px 8px; font-size: 12px; border: 1px solid var(--border);
      border-radius: 6px; background: var(--card); color: var(--text); }
    .pagebar button { width: auto; margin: 0; padding: 5px 10px; font-size: 15px; border: 1px solid var(--border);
      border-radius: 6px; background: var(--card); color: var(--text); cursor: pointer; }
    body { font-family: system-ui, sans-serif; background: var(--bg); display: flex; min-height: 100vh;
      align-items: center; justify-content: center; margin: 0; padding: 56px 0 24px; box-sizing: border-box; }
    .card { background: var(--card); padding: 32px; border-radius: 12px; box-shadow: 0 4px 24px var(--shadow);
      width: min(400px, 100% - 32px); }
    h1 { font-size: 18px; margin: 0 0 4px; color: var(--text); }
    .lead { font-size: 13px; color: var(--sub); margin: 0 0 16px; line-height: 1.6; }
    label { display: block; font-size: 13px; color: var(--sub); margin: 12px 0 4px; }
    /* iOS Safariは16px未満のinputで自動拡大するため16px未満にしない */
    input, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px;
      box-sizing: border-box; font-size: 16px; font-family: inherit; background: var(--bg); color: var(--text); }
    textarea { resize: vertical; min-height: 84px; }
    .hint { font-size: 12px; color: var(--sub); margin: 4px 0 0; line-height: 1.5; }
    button.primary { width: 100%; margin-top: 18px; padding: 11px; border: 0; border-radius: 8px;
      background: var(--accent); color: #fff; font-size: 15px; cursor: pointer; }
    button.primary:hover { background: var(--accent-hover); }
    button.primary:disabled { opacity: .6; cursor: default; }
    .err { color: var(--err); font-size: 13px; margin-top: 12px; min-height: 18px; }
    .ok { color: var(--ok); font-size: 14px; line-height: 1.6; }
    .hidden { display: none; }
    .foot { text-align: center; margin-top: 16px; font-size: 13px; }
    .foot a { color: var(--sub); text-decoration: none; }
    .foot a:hover { text-decoration: underline; }
    .chk { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 13px; color: var(--sub); }
    .chk input { width: auto; }
  </style>
  <link rel="icon" type="image/png" sizes="64x64" href="/static/img/favicon-64.png" />
  <!-- 広告タグ(gtag)・外部送信は入れない(入力内容(メールアドレス等)を扱うページのため・CLAUDE.md「Googleタグ(広告)まわりの必須ルール」)。 -->
</head>
<body>
  <div class="pagebar">
    <select id="fontSize" data-i18n-title="fontSize.title" title="文字の大きさ">
      <option value="" data-i18n="fontSize.optMedium">文字: 中</option>
      <option value="small" data-i18n="fontSize.optSmall">文字: 小</option>
      <option value="large" data-i18n="fontSize.optLarge">文字: 大</option>
      <option value="xlarge" data-i18n="fontSize.optXlarge">文字: 特大</option>
    </select>
    <select class="i18n-lang-select" title="Language"></select>
    <button type="button" id="themeToggle" data-i18n-title="topbar.themeToggleTitleStatic" title="ダーク/ライト切替">🌙</button>
  </div>
  <form class="card" id="f" novalidate>
    <h1>🐱 <span data-i18n="help.title">パスワードを忘れた方</span></h1>
    <p class="lead" data-i18n="help.lead">運営者が本人確認のうえ、パスワードを再設定するためのリンクをお送りします。下の項目をご入力ください。</p>
    <div id="vForm">
      <label for="hEmail" data-i18n="help.emailLabel">登録したメールアドレス（必須）</label>
      <input id="hEmail" name="email" type="text" inputmode="email" autocomplete="email" autocapitalize="none"
        autocorrect="off" spellcheck="false" maxlength="254" required />
      <label for="hNick" data-i18n="help.nicknameLabel">登録したときのお名前（ニックネーム）</label>
      <input id="hNick" name="nickname" autocomplete="off" maxlength="100" />
      <label for="hContact" data-i18n="help.contactLabel">ご連絡先のメールアドレス（任意）</label>
      <input id="hContact" name="contact" type="text" inputmode="email" autocomplete="off" autocapitalize="none"
        autocorrect="off" spellcheck="false" maxlength="254" />
      <p class="hint" data-i18n="help.contactHint">登録したメールアドレスが使い捨てなどで受け取れない場合は、受け取れるメールアドレスをご入力ください。空欄なら、登録したメールアドレスへご連絡します。</p>
      <label for="hNote" data-i18n="help.noteLabel">本人確認の手がかり（任意）</label>
      <textarea id="hNote" name="note" maxlength="1500" data-i18n-placeholder="help.notePlaceholder"
        placeholder="例: 9月下旬に登録・PayPayで800円チャージ・よく使う機能 など"></textarea>
      <p class="hint" data-i18n="help.privacy">入力いただいた内容は、本人確認とご連絡のためだけに使います。</p>
      <button type="submit" class="primary" id="hSubmit" data-i18n="help.submit">再設定を依頼する</button>
      <div class="err" id="hErr" role="alert"></div>
    </div>
    <p class="ok hidden" id="hDone" data-i18n="help.done">依頼を受け付けました。運営者が確認し、ご連絡先へ再設定用のリンクをお送りします。確認は手作業のため、お時間をいただくことがあります。</p>
    <div class="foot"><a href="/login" data-i18n="help.back">ログイン画面へ戻る</a></div>
  </form>
  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      function t(key, fb) { try { if (window.I18N) return window.I18N.t(key); } catch (e) { /* 辞書が使えなければ既定文 */ } return fb; }
      function emailOk(v) { return v.length > 0 && v.length <= 254 && v.indexOf('@') > 0 && v.split('@').pop().indexOf('.') > 0; }
      $('f').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var err = $('hErr'); err.textContent = '';
        var email = $('hEmail').value.trim();
        if (!emailOk(email)) { err.textContent = t('help.invalidEmail', 'メールアドレスの形式が正しくありません。'); return; }
        var btn = $('hSubmit'); btn.disabled = true; btn.textContent = t('help.sending', '送信しています…');
        fetch('/api/auth/password-help', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
          body: JSON.stringify({ email: email, nickname: $('hNick').value, contact: $('hContact').value.trim(), note: $('hNote').value })
        }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { status: r.status, d: d }; }); })
          .then(function (res) {
            if (res.d && res.d.ok) { $('vForm').classList.add('hidden'); $('hDone').classList.remove('hidden'); return; }
            var code = res.d && res.d.code;
            err.textContent = code === '2002' ? t('help.tooMany', '依頼が多すぎます。しばらく待ってからお試しください。')
              : code === '2010' ? t('help.invalidEmail', 'メールアドレスの形式が正しくありません。')
              : t('help.failed', '送信に失敗しました。時間をおいてもう一度お試しください。');
            btn.disabled = false; btn.textContent = t('help.submit', '再設定を依頼する');
          })
          .catch(function () {
            err.textContent = t('help.failed', '送信に失敗しました。時間をおいてもう一度お試しください。');
            btn.disabled = false; btn.textContent = t('help.submit', '再設定を依頼する');
          });
      });
    })();
  </script>
</body>
</html>
