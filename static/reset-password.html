<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <!-- 非対応ブラウザ向けの案内(2026-09-26)。ES5のみ・他のスクリプトより前に置く。 -->
  <script src="/static/js/compat-guard.js"></script>
  <title data-i18n="reset.metaTitle">パスワードの再設定｜nyangailab</title>
  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/i18n_dict.js"></script>
  <script src="/static/js/page-chrome.js"></script>
  <style>
    :root {
      --bg: #161c23; --card: #1f2733; --text: #e6edf3; --sub: #d5dde6;
      --border: #3d4a5e; --accent: #4da3ff; --accent-hover: #6db4ff;
      --err: #ff6b6b; --shadow: rgba(0,0,0,.4); --ok: #5fd08a;
    }
    :root[data-theme="light"] {
      --bg: #eef1f6; --card: #f9fafc; --text: #223; --sub: #556;
      --border: #ccd; --accent: #3b6fd4; --accent-hover: #2f5cb8;
      --err: #c0392b; --shadow: rgba(0,0,0,.08); --ok: #1e7a46;
    }
    :root[data-font-size="small"] body { zoom: 0.88; }
    :root[data-font-size="large"] body { zoom: 1.32; }
    :root[data-font-size="xlarge"] body { zoom: 1.63; }
    .pagebar { position: fixed; top: 12px; right: 12px; display: flex; gap: 8px; align-items: center; z-index: 10; }
    .pagebar select { width: auto; margin: 0; padding: 5px 8px; font-size: 12px; border: 1px solid var(--border);
      border-radius: 6px; background: var(--card); color: var(--text); }
    .pagebar button { width: auto; margin: 0; padding: 5px 10px; font-size: 15px; border: 1px solid var(--border);
      border-radius: 6px; background: var(--card); color: var(--text); cursor: pointer; }
    body { font-family: system-ui, sans-serif; background: var(--bg); display: flex; min-height: 100vh;
      align-items: center; justify-content: center; margin: 0; padding: 56px 0 24px; box-sizing: border-box; }
    .card { background: var(--card); padding: 32px; border-radius: 12px; box-shadow: 0 4px 24px var(--shadow);
      width: min(400px, 100% - 32px); }
    h1 { font-size: 18px; margin: 0 0 4px; color: var(--text); }
    .lead { font-size: 13px; color: var(--sub); margin: 0 0 16px; line-height: 1.6; }
    label { display: block; font-size: 13px; color: var(--sub); margin: 12px 0 4px; }
    /* iOS Safariは16px未満のinputで自動拡大するため16px未満にしない */
    input, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px;
      box-sizing: border-box; font-size: 16px; font-family: inherit; background: var(--bg); color: var(--text); }
    textarea { resize: vertical; min-height: 84px; }
    .hint { font-size: 12px; color: var(--sub); margin: 4px 0 0; line-height: 1.5; }
    button.primary { width: 100%; margin-top: 18px; padding: 11px; border: 0; border-radius: 8px;
      background: var(--accent); color: #fff; font-size: 15px; cursor: pointer; }
    button.primary:hover { background: var(--accent-hover); }
    button.primary:disabled { opacity: .6; cursor: default; }
    .err { color: var(--err); font-size: 13px; margin-top: 12px; min-height: 18px; }
    .ok { color: var(--ok); font-size: 14px; line-height: 1.6; }
    .hidden { display: none; }
    .foot { text-align: center; margin-top: 16px; font-size: 13px; }
    .foot a { color: var(--sub); text-decoration: none; }
    .foot a:hover { text-decoration: underline; }
    .chk { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 13px; color: var(--sub); }
    .chk input { width: auto; }
  </style>
  <link rel="icon" type="image/png" sizes="64x64" href="/static/img/favicon-64.png" />
  <!-- 広告タグ(gtag)・外部送信は入れない(リンクのトークン(URLの#以降)を扱うページのため。error-report.jsも入れない・CLAUDE.md「Googleタグ(広告)まわりの必須ルール」)。 -->
</head>
<body>
  <div class="pagebar">
    <select id="fontSize" data-i18n-title="fontSize.title" title="文字の大きさ">
      <option value="" data-i18n="fontSize.optMedium">文字: 中</option>
      <option value="small" data-i18n="fontSize.optSmall">文字: 小</option>
      <option value="large" data-i18n="fontSize.optLarge">文字: 大</option>
      <option value="xlarge" data-i18n="fontSize.optXlarge">文字: 特大</option>
    </select>
    <select class="i18n-lang-select" title="Language"></select>
    <button type="button" id="themeToggle" data-i18n-title="topbar.themeToggleTitleStatic" title="ダーク/ライト切替">🌙</button>
  </div>
  <div class="card">
    <h1>🐱 <span data-i18n="reset.title">パスワードの再設定</span></h1>
    <p class="lead hidden" id="vChecking" data-i18n="reset.checking">リンクを確認しています…</p>
    <div class="hidden" id="vInvalid">
      <p class="lead" style="color:var(--err)" data-i18n="reset.invalid">このリンクは無効か、期限が切れています。お手数ですが、もう一度ご依頼ください。</p>
      <div class="foot"><a href="/static/password-help.html" data-i18n="login.forgotLink">パスワードを忘れた方はこちら</a></div>
    </div>
    <form class="hidden" id="vForm" novalidate>
      <p class="lead" data-i18n="reset.lead">新しいパスワードを入力してください。設定すると、これまでにログインしていた端末はすべてログアウトされます。</p>
      <label for="rNew" data-i18n="reset.newLabel">新しいパスワード</label>
      <input id="rNew" name="new_password" type="password" autocomplete="new-password" minlength="8" maxlength="32"
        autocapitalize="none" autocorrect="off" spellcheck="false" required />
      <p class="hint" data-i18n="signup.passwordHint">8〜32文字。半角の英字・数字・記号のうち2種類以上を組み合わせてください。</p>
      <label for="rConf" data-i18n="reset.confirmLabel">新しいパスワード（確認）</label>
      <input id="rConf" name="password_confirm" type="password" autocomplete="new-password" minlength="8" maxlength="32"
        autocapitalize="none" autocorrect="off" spellcheck="false" required />
      <label class="chk"><input type="checkbox" id="rShow" /> <span data-i18n="login.showPassword">パスワードを表示</span></label>
      <button type="submit" class="primary" id="rSubmit" data-i18n="reset.submit">パスワードを設定する</button>
      <div class="err" id="rErr" role="alert"></div>
    </form>
    <div class="hidden" id="vDone">
      <p class="ok" data-i18n="reset.done">パスワードを設定しました。新しいパスワードでログインしてください。</p>
      <div class="foot"><a href="/login" data-i18n="reset.toLogin">ログイン画面へ</a></div>
    </div>
  </div>
  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      function t(key, fb) { try { if (window.I18N) return window.I18N.t(key); } catch (e) { /* 辞書が使えなければ既定文 */ } return fb; }
      // トークンはURLの#以降(サーバーへ送られない)から読み、すぐにアドレス欄・履歴から消す(画面共有・スクリーンショット対策)。
      // 以後はこのスクリプトのメモリ上だけで持つ(再読み込みすると無効になる=リンクをもう一度開く)。
      var token = '';
      try {
        var m = /^#t=([A-Za-z0-9_-]{20,200})$/.exec(location.hash || '');
        if (m) token = m[1];
        history.replaceState(null, '', location.pathname);
      } catch (e) { /* 使えない環境 */ }
      function show(name) {
        ['Checking', 'Invalid', 'Form', 'Done'].forEach(function (n) { $('v' + n).classList.toggle('hidden', n !== name); });
      }
      function post(path, body) {
        return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
          body: JSON.stringify(body) }).then(function (r) { return r.json().catch(function () { return {}; }); });
      }
      if (!token) { show('Invalid'); }
      else {
        show('Checking');
        post('/api/auth/password-reset/check', { token: token })
          .then(function (d) { show(d && d.valid ? 'Form' : 'Invalid'); })
          .catch(function () { show('Invalid'); });
      }
      $('rShow').addEventListener('change', function () {
        var type = this.checked ? 'text' : 'password';
        $('rNew').type = type; $('rConf').type = type;
      });
      $('vForm').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var err = $('rErr'); err.textContent = '';
        var pw = $('rNew').value;
        if (pw !== $('rConf').value) { err.textContent = t('reset.mismatch', '確認用のパスワードが一致しません。'); return; }
        var btn = $('rSubmit'); btn.disabled = true;
        post('/api/auth/password-reset', { token: token, new_password: pw }).then(function (d) {
          if (d && d.ok) { token = ''; $('rNew').value = ''; $('rConf').value = ''; show('Done'); return; }
          btn.disabled = false;
          if (d && d.code === '2017') { token = ''; show('Invalid'); return; }
          err.textContent = (d && d.error) || t('reset.failed', '設定に失敗しました。時間をおいてもう一度お試しください。');
        }).catch(function () { btn.disabled = false; err.textContent = t('reset.failed', '設定に失敗しました。時間をおいてもう一度お試しください。'); });
      });
    })();
  </script>
</body>
</html>
